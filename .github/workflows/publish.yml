name: Publish npm package

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish from the selected dev or master branch (dev uses the dev npm tag; master uses latest)
        type: boolean
        required: true
        default: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-package:
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: record published npm version')"
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  publish-npm:
    name: Publish to npm
    if: ${{ (github.event_name == 'push' || inputs.publish_npm) && (github.ref_name == 'master' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'dev')) }}
    runs-on: ubuntu-latest
    needs: verify-package
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    outputs:
      published_version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Choose next publish version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          # Read all published versions, not just the latest dist-tag: dist-tags can lag
          # behind a version that has already been published.
          PUBLISHED_VERSIONS="$(npm view androidmcp-framework versions --json --registry=https://registry.npmjs.org)"
          NEXT_VERSION="$(node --input-type=module - "$CURRENT_VERSION" "$PUBLISHED_VERSIONS" <<'NODE'
          const [, , currentText, versionsText] = process.argv;
          const parse = (v) => v.split('-')[0].split('.').map((x) => Number.parseInt(x, 10));
          const compare = (a, b) => {
            const aa = parse(a), bb = parse(b);
            for (let i = 0; i < 3; i++) {
              if ((aa[i] ?? 0) !== (bb[i] ?? 0)) return (aa[i] ?? 0) > (bb[i] ?? 0) ? 1 : -1;
            }
            return 0;
          };
          let published;
          try {
            published = JSON.parse(versionsText);
          } catch {
            throw new Error('Could not parse published npm versions; refusing to publish blindly.');
          }
          if (!Array.isArray(published)) published = [published];
          const current = parse(currentText);
          const currentAlreadyPublished = published.includes(currentText);
          const maxPublished = published.reduce((max, version) =>
            !max || compare(version, max) > 0 ? version : max, null);
          const base = maxPublished && compare(maxPublished, currentText) > 0
            ? parse(maxPublished)
            : current;
          if (currentAlreadyPublished || (maxPublished && compare(maxPublished, currentText) >= 0)) {
            base[2] = (base[2] ?? 0) + 1;
          }
          process.stdout.write(base.slice(0, 3).join('.'));
          NODE
          )"
          if [ "$NEXT_VERSION" != "$CURRENT_VERSION" ]; then
            npm version "$NEXT_VERSION" --no-git-tag-version
          fi
          TARGET_BRANCH="$GITHUB_REF_NAME"
          if [[ "$TARGET_BRANCH" != "master" && "$TARGET_BRANCH" != "dev" ]]; then
            echo "Refusing to publish branch '$TARGET_BRANCH'. Select dev or master." >&2
            exit 1
          fi
          if [[ "$TARGET_BRANCH" == "master" ]]; then
            DIST_TAG="latest"
          else
            DIST_TAG="dev"
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Publishing AndroidMCP Framework $NEXT_VERSION from $TARGET_BRANCH using npm tag $DIST_TAG"
      - name: Build release package
        run: npm run build
      - name: Publish package using npm trusted publishing
        env:
          DIST_TAG: ${{ steps.release-version.outputs.dist_tag }}
        run: npm publish --access public --tag "$DIST_TAG"
      - name: Commit published version to selected branch
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
          TARGET_BRANCH: ${{ steps.release-version.outputs.target_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Package version already matches published version."
            exit 0
          fi
          git commit -m "chore: record published npm version v${VERSION}"
          # Never force-push and never push a dev build to master (or vice versa).
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

