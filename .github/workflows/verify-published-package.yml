name: Verify published npm package

on:
  push:
    branches: [master]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-published-package.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Exact published androidmcp-framework version to smoke-test (blank uses package.json)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: published-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Install exact npm release and verify CLI + MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Resolve published version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$(jq -r .version package.json)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Wait for npm registry and smoke-test exact release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/androidmcp-published-smoke"
          mkdir -p "$SMOKE_DIR"
          visible=false
          # npm can acknowledge a publish before package metadata is available
          # from the public registry. Poll metadata first to avoid noisy ETARGET
          # install errors and allow up to 12 minutes for propagation.
          for attempt in $(seq 1 72); do
            if npm view "androidmcp-framework@${VERSION}" version --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/published-version.json" 2>/dev/null; then
              if [ "$(tr -d '"\r\n ' < "$RUNNER_TEMP/published-version.json")" = "\"$VERSION\"" ]; then
                visible=true
                break
              fi
            fi
            echo "Waiting for androidmcp-framework@${VERSION} metadata on npm (attempt ${attempt}/72)."
            sleep 10
          done
          if [ "$visible" != true ]; then
            echo "::error::npm acknowledged publication, but androidmcp-framework@${VERSION} was not visible on registry.npmjs.org after 12 minutes."
            echo "The publish workflow's exact-tarball smoke test is a separate check and does not prove public registry installability."
            exit 1
          fi
          npm install --prefix "$SMOKE_DIR" "androidmcp-framework@${VERSION}" --registry=https://registry.npmjs.org
          node scripts/smoke-published-package.mjs "$SMOKE_DIR" "$VERSION"
