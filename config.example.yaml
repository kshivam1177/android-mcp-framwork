# AndroidMCP Framework project config.
# Created at .androidmcp-framework/config.yaml by `androidmcp-framework setup`.
# Every field is optional; the whole file is optional.

schemaVersion: 1

# MCP workflows exposed to your coding agent.
enabledWorkflows:
  - device
  - ui-automation
  - session-management
  - doctor
  - workflow-discovery
  - testing-intelligence

customWorkflows: {}

# UI automation uses Android SDK platform-tools (adb); no Python runtime required.
automationBackend: adb

disableSessionDefaults: false
debug: false

sessionDefaults:
  projectPath: . # workspace root; Flutter/native project roots are auto-detected
  module: :app
  variant: debug
  targetId: null
  avdName: null
  applicationId: null
  gradleTaskPrefix: null

paths:
  adbPath: adb
  gradlePath: null
  androidHome: null
  javaHome: null
  androidCliPath: android
