name: Publish npm package and MCP Registry metadata

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the npm package
        type: boolean
        required: true
        default: true
      publish_mcp_registry:
        description: Publish to the Official MCP Registry
        type: boolean
        required: true
        default: true

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-package:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: record published npm version') }}
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  publish-npm:
    name: Publish to npm
    if: ${{ github.event_name == 'push' || inputs.publish_npm }}
    runs-on: ubuntu-latest
    needs: verify-package
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    outputs:
      published_version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Choose next publish version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          LATEST_VERSION="$(npm view androidmcp-framework version 2>/dev/null || echo '0.0.0')"
          NEXT_VERSION="$(node --input-type=module - "$CURRENT_VERSION" "$LATEST_VERSION" <<'NODE'
          const [, , currentText, latestText] = process.argv;
          const parse = (v) => v.split('-')[0].split('.').map((x) => Number.parseInt(x, 10));
          const compare = (a, b) => {
            const aa = parse(a), bb = parse(b);
            for (let i = 0; i < 3; i++) {
              if ((aa[i] ?? 0) !== (bb[i] ?? 0)) return (aa[i] ?? 0) > (bb[i] ?? 0) ? 1 : -1;
            }
            return 0;
          };
          const current = parse(currentText);
          if (compare(latestText, currentText) >= 0) {
            current[2] = Math.max(current[2] ?? 0, parse(latestText)[2] ?? 0) + 1;
          }
          process.stdout.write(current.slice(0, 3).join('.'));
          NODE
          )"
          if [ "$NEXT_VERSION" != "$CURRENT_VERSION" ]; then
            npm version "$NEXT_VERSION" --no-git-tag-version
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing AndroidMCP Framework $NEXT_VERSION"
      - name: Build release package
        run: npm run build
      - name: Publish package using npm trusted publishing
        run: npm publish --access public
      - name: Commit published version to master
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Package version already matches published version."
            exit 0
          fi
          git commit -m "chore: record published npm version v${VERSION}"
          git push origin HEAD:master

  publish-mcp-registry:
    name: Publish to Official MCP Registry
    if: ${{ always() && needs.verify-package.result == 'success' && (github.event_name == 'push' || inputs.publish_mcp_registry) && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - verify-package
      - publish-npm
    environment: mcp-registry-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve registry version
        id: package-version
        env:
          NPM_RELEASE_VERSION: ${{ needs.publish-npm.outputs.published_version }}
        run: |
          set -euo pipefail
          if [ -n "$NPM_RELEASE_VERSION" ]; then
            VERSION="$NPM_RELEASE_VERSION"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Synchronize registry metadata with package version
        env:
          PUBLISHED_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.PUBLISHED_VERSION;
          const manifest = JSON.parse(fs.readFileSync('server.json', 'utf8'));
          manifest.version = version;
          for (const item of manifest.packages ?? []) item.version = version;
          fs.writeFileSync('server.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          chmod +x ./mcp-publisher
      - name: Authenticate to MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Validate server metadata
        run: ./mcp-publisher validate ./server.json
      - name: Publish server metadata
        run: ./mcp-publisher publish ./server.json
